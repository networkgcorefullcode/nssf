info:
  version: 1.0.0
  description: NSSF initial local configuration

configuration:
  nssfName: NSSF # the name of this NSSF
  sbi: # Service-based interface information
    scheme: http # the protocol for sbi (http or https)
    registerIPv4: "172.28.31.5" # IP used to register to NRF
    bindingIPv4: "0.0.0.0"  # IP used to bind the service
    port: 29015 # port used to bind the service
    tls: # the local path of TLS key
      key: /support/TLS/nssf.key # NSSF TLS Private key
      pem: /support/TLS/nssf.pem # NSSF TLS Certificate
  serviceNameList:
    - nnssf-nsselection
    - nnssf-nssaiavailability
  nrfUri: http://localhost:29000 # a valid URI of NRF
  webuiUri: http://localhost:5001 # WebUI URI
  # supportedNssaiInPlmnList: [] # Supported NSSAI in PLMN list
  nsiList: # Network Slice Instance configurations
    - snssai: # S-NSSAI
        sst: 1 # Slice/Service Type (uinteger, range: 0~255)
        sd: 010203 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
      nsiInformationList:
        - nrfId: http://localhost:29000/nnrf-nfm/v1/nf-instances
          nsiId: 10
    - snssai:
        sst: 1
        sd: 112233
      nsiInformationList:
        - nrfId: http://localhost:29000/nnrf-nfm/v1/nf-instances
          nsiId: 11
  amfSetList: # AMF Set configurations
    - amfSetId: 1 # AMF Set ID
      amfList: # List of AMF NF Ids in this set
        # - 469de254-2fe5-4ca0-8381-af3f500af77c
      # nrfAmfSet: http://localhost:8000/nnrf-nfm/v1/nf-instances
      supportedNssaiAvailabilityData:
        - tai: # Tracking Area Identifier
            plmnId:
              mcc: 208 # Mobile Country Code
              mnc: 93 # Mobile Network Code
            tac: 1 # Tracking Area Code
          supportedSnssaiList:
            - sst: 1
              sd: 010203
            - sst: 1
              sd: 112233
  amfList: # AMF configurations
    - nfId: 469de254-2fe5-4ca0-8381-af3f500af77c
      supportedNssaiAvailabilityData:
        - tai:
            plmnId:
              mcc: 208
              mnc: 93
            tac: 1
          supportedSnssaiList:
            - sst: 1
              sd: 010203
            - sst: 1
              sd: 112233
  taList: # Tracking Area configurations
    - tai:
        plmnId:
          mcc: 208
          mnc: 93
        tac: 1
      accessType: 3GPP_ACCESS
      supportedSnssaiList:
        - sst: 1
          sd: 010203
        - sst: 1
          sd: 112233
      # restrictedSnssaiList: []
  mappingListFromPlmn: # Mapping of S-NSSAI from PLMN
    - operatorName: Aether
      homePlmnId:
        mcc: 208
        mnc: 93
      mappingOfSnssai:
        - servingSnssai:
            sst: 1
            sd: 010203
          homeSnssai:
            sst: 1
            sd: 010203
        - servingSnssai:
            sst: 1
            sd: 112233
          homeSnssai:
            sst: 1
            sd: 112233
  metricsPort: ":9099" # Prometheus metrics port
  # Manual configuration for network functions (optional)
  # manualConfigs:
  #   enabled: false
  #   nfs: {}

# Subscriptions (optional)
# subscriptions:
#   - subscriptionId: subscription-1
#     subscriptionData:
#       nfId: 469de254-2fe5-4ca0-8381-af3f500af77c
#       notificationUri: http://127.0.0.1:8000/nssf-callback/v1/subscriptions

# the kind of log output
# debugLevel: how detailed to output, value: trace, debug, info, warn, error, fatal, panic
# ReportCaller: enable the caller report or not, value: true or false
logger:
  NSSF:
    debugLevel: info
    ReportCaller: false
  PathUtil:
    debugLevel: info
    ReportCaller: false
  OpenApi:
    debugLevel: info
    ReportCaller: false
